[package]
name = "anomalous-commits"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
arrow = "56.2.0"
chashmap = "2.2.2"
chrono = "0.4.42"
dotenvy = "0.15.7"
flexi_logger = "0.31.7"
indicatif = "0.18.0"
log = "0.4.28"
lru = "0.12.5"
num_cpus = "1.17.0"
once_cell = "1.20.2"
orc-rust = "0.6.3"
rayon = "1.11.0"
rocksdb = "0.24.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
plotters = { version = "0.3", optional = true }
swh-graph = "8.0.11"
swh-graph-stdlib = "8.0.11"
rusqlite = { version = "0.37.0", features = ["bundled"] }

[features]
default = []
plotting = ["plotters"]
